name: Refresh Roblox data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh official Roblox data and media
        run: node scripts/refresh-roblox-data.mjs
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/roblox.json assets/icons assets/screens
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh Roblox data"
          git push
